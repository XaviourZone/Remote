name: Better Half – build Android APK

# Builds the Android app (a Trusted Web Activity that opens the Better Half web app full screen)
# and attaches it to the "betterhalf-latest" release.
on:
  push:
    branches: [main, better-half]
    paths:
      - "BetterHalf/android/**"
      - ".github/workflows/betterhalf-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: betterhalf-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BetterHalf/android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Optional private signing key (same secrets as universal-remote)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/BetterHalf.apk"

      - name: Signing fingerprint (needed for assetlinks.json)
        run: keytool -printcert -jarfile "$GITHUB_WORKSPACE/BetterHalf.apk" | grep -i "SHA256" || true

      - uses: actions/upload-artifact@v4
        with:
          name: BetterHalf-apk
          path: BetterHalf.apk

      - name: Publish to the betterhalf-latest release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete betterhalf-latest --yes --cleanup-tag || true
          gh release create betterhalf-latest BetterHalf.apk \
            --target "${{ github.sha }}" \
            --title "Better Half for Android (build ${{ github.run_number }})" \
            --notes "Install BetterHalf.apk on Android. It opens the Better Half web app full screen with notifications and vibration." \
            --latest=false
