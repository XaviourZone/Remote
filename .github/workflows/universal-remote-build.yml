name: Universal Remote – build APK

on:
  push:
    branches: [main]
    paths:
      - "universal-remote/**"
      - "!universal-remote/database/**"
      - ".github/workflows/universal-remote-build.yml"
  pull_request:
    paths:
      - "universal-remote/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: universal-remote-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universal-remote
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch Flipper-IRDB sample for encoder tests
        run: git clone --depth 1 https://github.com/Lucaslhm/Flipper-IRDB.git "$RUNNER_TEMP/irdb"

      - name: Optional private signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        env:
          IRDB_DIR: ${{ runner.temp }}/irdb
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/UniversalRemote.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: UniversalRemote-apk
          path: universal-remote/out/UniversalRemote.apk

      - name: Publish GitHub release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="universal-remote-v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" out/UniversalRemote.apk \
            --title "Universal Remote 1.0.${GITHUB_RUN_NUMBER}" \
            --notes "Install UniversalRemote.apk on your phone (allow 'Install unknown apps'). Built from ${GITHUB_SHA::7}." \
            --latest
